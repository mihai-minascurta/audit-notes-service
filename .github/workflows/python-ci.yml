name: Phase 1 - CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  LOCAL_IMAGE_NAME: audit-notes-app
  LOCAL_IMAGE_TAG: "1.0"
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/audit-notes-service
  IMAGE_TAG_SHA: sha-${{ github.sha }}
  IMAGE_TAG_LATEST: latest
jobs:
  python-tests:
    name: Run Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r image/requirements.txt
          pip install pytest

      - name: Check Python syntax
        run: |
          set -euo pipefail
          python -m py_compile image/app.py

      - name: Run pytest
        run: |
          set -euo pipefail
          PYTHONPATH=image pytest -q

  docker-build:
    name: Build Docker image and test container
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build -t $LOCAL_IMAGE_NAME:$LOCAL_IMAGE_TAG ./image

      - name: Show Docker image
        run: |
          set -euo pipefail
          docker images | grep $LOCAL_IMAGE_NAME

      - name: Run container
        run: |
          set -euo pipefail
          docker run -d \
            --name audit-notes-ci \
            -p 5555:5555 \
            -e APP_MODE=ci \
            -e MESSAGE="Running in GitHub Actions" \
            -e DATA_PATH=/data/message.txt \
            $LOCAL_IMAGE_NAME:$LOCAL_IMAGE_TAG

      - name: Health check container
        run: |
          set -euo pipefail

          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:5555/health; then
              echo
              echo "Container health check passed"
              exit 0
            fi

            echo "Waiting for container..."
            sleep 3
          done

          echo "Container health check failed"
          docker ps -a
          docker logs audit-notes-ci
          exit 1

      - name: Test write and read endpoints
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:5555/write
          echo
          curl -fsS http://127.0.0.1:5555/read
          echo

      - name: Log in to GitHub Container Registry
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u "${{ github.actor }}" --password-stdin
      - name: Tag and push Docker image to GHCR
        run: |
          set -euo pipefail

          docker tag $LOCAL_IMAGE_NAME:$LOCAL_IMAGE_TAG $REGISTRY_IMAGE:$IMAGE_TAG_SHA
          docker tag $LOCAL_IMAGE_NAME:$LOCAL_IMAGE_TAG $REGISTRY_IMAGE:$IMAGE_TAG_LATEST

          docker push $REGISTRY_IMAGE:$IMAGE_TAG_SHA
          docker push $REGISTRY_IMAGE:$IMAGE_TAG_LATEST

      - name: Show container logs
        if: always()
        run: |
          docker logs audit-notes-ci || true

      - name: Stop container
        if: always()
        run: |
          docker rm -f audit-notes-ci || true

  kind-cluster:
    name: Start Kind Kubernetes cluster
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Kind
        run: |
          set -euo pipefail
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create Kind cluster
        run: |
          set -euo pipefail
          kind create cluster --name audit-ci
          kubectl cluster-info
          kubectl get nodes
      - name: Install Helm
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version
      - name: Ensure namespace
        run: kubectl create namespace audit

      - name: Create GHCR pull secret
        run: |
            set -euo pipefail
            kubectl -n audit create secret docker-registry ghcr-auth \
            --docker-server=$REGISTRY \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"

      - name: Deploy with Helm
        run: |
            set -euo pipefail
            helm upgrade --install audit-release helm-chart/ \
            --namespace audit \
            --create-namespace \
            --set image.repository=$REGISTRY_IMAGE \
            --set image.tag=$IMAGE_TAG_SHA \
            --wait \
            --timeout 120s

      - name: Verify Deployment uses GHCR SHA image
        run: |
          set -euo pipefail

          EXPECTED_IMAGE="$REGISTRY_IMAGE:$IMAGE_TAG_SHA"

          ACTUAL_IMAGE=$(kubectl -n audit get deployment main-deployment \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="main-container")].image}')

          echo "Expected image: $EXPECTED_IMAGE"
          echo "Actual image:   $ACTUAL_IMAGE"

          if [ "$ACTUAL_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "Deployment is not using the expected GHCR SHA image"
            exit 1
          fi

          echo "Deployment uses the expected GHCR SHA image"

      - name: Show Kubernetes state
        if: always()
        run: |
          kubectl -n audit get all
          kubectl -n audit get pods -o wide
          kubectl -n audit get events --sort-by=.metadata.creationTimestamp | tail -40

      - name: Health check through Kubernetes Service
        run: |
          set -euo pipefail

          kubectl -n audit port-forward svc/main-service 5050:5050 > /tmp/port-forward.log 2>&1 &
          PF_PID=$!

          sleep 5

          curl -fsS http://127.0.0.1:5050/health
          echo
          curl -fsS http://127.0.0.1:5050/write
          echo
          curl -fsS http://127.0.0.1:5050/read
          echo

          kill $PF_PID

      - name: Show port-forward logs
        if: always()
        run: |
          cat /tmp/port-forward.log || true

      - name: Delete Kind cluster
        if: always()
        run: |
          kind delete cluster --name audit-ci || true