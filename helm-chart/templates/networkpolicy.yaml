apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: main-networkpolicy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.app.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.allowedNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.allowedPodLabel }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}