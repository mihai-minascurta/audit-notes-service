apiVersion: batch/v1
kind: CronJob
metadata:
  name: main-cronjob
  namespace: audit
spec:
  schedule: "* * * * *"          # rulează o dată pe minut
  concurrencyPolicy: Forbid       # nu pornește un job nou dacă cel anterior rulează încă
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: note-checker
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - |
                  NOTE_PATH="/data/defaultnote.txt"
                  REPORT_DIR="/data/reports"
                  TIMESTAMP=$(date '+%Y-%m-%dT%H:%M:%S')
                  REPORT_FILE="${REPORT_DIR}/report_$(date '+%Y%m%d_%H%M%S').txt"

                  # Creează directorul de rapoarte dacă nu există
                  mkdir -p "$REPORT_DIR"

                  # Verifică dacă notița există
                  if [ -f "$NOTE_PATH" ]; then
                    STATUS="EXISTS"
                    SIZE=$(wc -c < "$NOTE_PATH")
                    LINES=$(wc -l < "$NOTE_PATH")
                    LAST_MODIFIED=$(stat -c '%y' "$NOTE_PATH" 2>/dev/null || echo "N/A")

                    {
                      echo "===== RAPORT VERIFICARE NOTIȚĂ ====="
                      echo "Timestamp:        $TIMESTAMP"
                      echo "Status:           $STATUS"
                      echo "Cale fișier:      $NOTE_PATH"
                      echo "Dimensiune:       ${SIZE} bytes"
                      echo "Număr linii:      $LINES"
                      echo "Ultima modificare: $LAST_MODIFIED"
                      echo "====================================="
                    } > "$REPORT_FILE"

                    echo "[OK] Notița există. Raport scris în $REPORT_FILE"
                  else
                    STATUS="MISSING"

                    {
                      echo "===== RAPORT VERIFICARE NOTIȚĂ ====="
                      echo "Timestamp:   $TIMESTAMP"
                      echo "Status:      $STATUS"
                      echo "Cale fișier: $NOTE_PATH"
                      echo "Detalii:     Fișierul nu a fost găsit pe volum."
                      echo "====================================="
                    } > "$REPORT_FILE"

                    echo "[WARN] Notița lipsește. Raport scris în $REPORT_FILE"
                  fi

                  # Păstrează doar ultimele 60 de rapoarte (1 oră de istoric)
                  ls -1t "${REPORT_DIR}/report_"*.txt 2>/dev/null | tail -n +61 | xargs -r rm --

              volumeMounts:
                - name: data-volume
                  mountPath: /data

          volumes:
            - name: data-volume
              persistentVolumeClaim:
                claimName: main-pvc
