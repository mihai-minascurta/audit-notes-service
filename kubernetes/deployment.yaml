apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-deployment
  namespace: audit
  labels:
    app: audit-nodes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-nodes
  template:
    metadata:
      labels:
        app: audit-nodes
    spec:
      serviceAccountName: main-serviceaccount

      initContainers:
        - name: init-data
          image: busybox
          command: ["sh", "-c", "mkdir -p /data && echo 'folder ready'"]
          volumeMounts:
            - mountPath: /data
              name: data-volume

      containers:
        - name: main-container
          image: audit-notes-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5555
          env:
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: main-configmap
                  key: APP_MODE
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: main-configmap
                  key: MESSAGE
            - name: DATA_PATH
              valueFrom:
                configMapKeyRef:
                  name: main-configmap
                  key: DATA_PATH
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: main-secret
                  key: API_TOKEN
          volumeMounts:
            - mountPath: /data
              name: data-volume
            - mountPath: /logs
              name: logs-volume
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5555
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5555
            initialDelaySeconds: 15
            periodSeconds: 20

        - name: sidecar-log
          image: busybox:1.36
          command: ["sh", "-c", "tail -F /logs/app.log 2>/dev/null || sleep infinity"]
          volumeMounts:
            - mountPath: /logs
              name: logs-volume

      volumes:
        - name: logs-volume
          emptyDir: {}
        - name: data-volume
          persistentVolumeClaim:
            claimName: main-pvc
